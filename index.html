<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feeback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>User Feeback Form</h1>
    <form id="feedbackForm">
        <label for="userName" id="username-label">Username: </label><br>
        <input type="text" id="userName" name="userName"><br>
        <label for="userEmail" id="user-email-label">Email: </label><br>
        <input type="text" id="userEmail" name="userEmail"><br>
        <label for="comments" id="comments-label">Comments: </label><br>
        <textarea id="comments"></textarea>
        <button id="submit" type="submit">Submit</button>
    </form>
    <p>Character Count: 0</p>
    <div id="feedback-display"></div>
    <script src="cp_1.js"></script>
</body>
</html>
